name: Build Gravedigger

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S Gravedigger -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --target Gravedigger_VST3 --parallel
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Gravedigger-Windows-VST3
          path: build/Gravedigger_artefacts/Release/VST3/
